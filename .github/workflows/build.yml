name: Build 1Panel

on:
  push:
    branches: [ release-1.10 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Create empty frontend files
        run: |
          mkdir -p cmd/server/web/assets
          touch cmd/server/web/index.html
          touch cmd/server/web/assets/.gitkeep

      - name: Build
        run: |
          cd backend
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o 1panel ../cmd/server/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-binary
          path: backend/1panel
